<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم الروبوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
</head>
<body>

  <div class="device" id="device">
    <h1 id="title">تحكم بالروبوت</h1>
    <p class="subtitle" id="subtitle">اضغط أو تكلم</p>

    <div class="control-pad">
      <button class="btn forward"  onclick="sendCommand('forward')">▲</button>
      <button class="btn left"     onclick="sendCommand('left')">◀</button>
      <button class="btn stop"     onclick="sendCommand('stop')">■</button>
      <button class="btn right"    onclick="sendCommand('right')">▶</button>
      <button class="btn backward" onclick="sendCommand('backward')">▼</button>
    </div>

    <div id="status">جاهز</div>

    <div class="divider"></div>

    <div class="voice-panel">
      <div class="lang-toggle">
        <button class="lang-btn active" id="langAr" onclick="setLang('ar-SA')">العربية</button>
        <button class="lang-btn" id="langEn" onclick="setLang('en-US')">English</button>
      </div>
      <button class="mic-btn" id="micBtn" onclick="toggleListening()">🎤</button>
      <div id="heard"></div>
    </div>
  </div>

  <script src="Script.js"></script>

</body>
</html>
